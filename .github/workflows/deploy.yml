name: Auto Deploy Virtual CFO to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Auto Deploy on SSH Server
    runs-on: ubuntu-latest

    steps:
      - name: Execute Remote SSH Deployment Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            echo "========================================="
            echo "🚀 STARTING AUTOMATIC DEPLOYMENT ON SERVER"
            echo "========================================="
            cd /var/www/Virtual-CFO
            git fetch origin main
            git reset --hard origin/main
            npm install
            npm run build
            pm2 restart all
            echo "✅ AUTOMATIC DEPLOYMENT COMPLETED SUCCESSFULLY!"
